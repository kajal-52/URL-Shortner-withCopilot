spring:
  application:
    name: URL-Shortner-withCopilot
  datasource:
    url: jdbc:h2:mem:urlshortner;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8082
