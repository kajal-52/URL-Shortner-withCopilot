<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>Shorten your links</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #68738a;
            --line: #e3e7f0;
            --primary: #5b5ce2;
            --primary-dark: #4849c8;
            --surface: rgba(255, 255, 255, 0.86);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 0%, rgba(181, 185, 255, 0.42), transparent 30rem),
                radial-gradient(circle at 100% 100%, rgba(167, 243, 208, 0.28), transparent 28rem),
                #f6f7fb;
        }

        .page {
            width: min(100% - 40px, 760px);
            margin: 0 auto;
            padding: 74px 0 56px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 9px;
            color: #ffffff;
            background: linear-gradient(135deg, #7779f2, #4b4cc9);
            box-shadow: 0 7px 16px rgba(91, 92, 226, 0.28);
        }

        .hero {
            margin: 74px auto 30px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--primary);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 650px;
            margin: 0 auto;
            color: #111827;
            font-size: clamp(2.6rem, 8vw, 5rem);
            letter-spacing: -0.075em;
            line-height: 0.98;
        }

        .subtitle {
            max-width: 500px;
            margin: 24px auto 0;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.65;
        }

        .shortener-card {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 25px 70px rgba(40, 48, 94, 0.13);
            backdrop-filter: blur(18px);
            animation: rise 0.55s ease both;
        }

        .form-panel {
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.74);
        }

        label {
            display: block;
            margin-bottom: 11px;
            color: #333b50;
            font-size: 0.87rem;
            font-weight: 750;
        }

        .input-row {
            display: flex;
            gap: 10px;
            padding: 6px;
            border: 1px solid #d9deeb;
            border-radius: 13px;
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-row:focus-within {
            border-color: #999af0;
            box-shadow: 0 0 0 4px rgba(91, 92, 226, 0.12);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 13px 12px;
            border: 0;
            outline: 0;
            color: var(--ink);
            background: transparent;
            font: inherit;
            font-size: 0.98rem;
        }

        input::placeholder {
            color: #a4adbf;
        }

        button,
        .open-button,
        .copy-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font: inherit;
            font-weight: 750;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .submit-button {
            min-width: 142px;
            padding: 13px 18px;
            color: #ffffff;
            background: linear-gradient(135deg, #7072ef, var(--primary));
            box-shadow: 0 7px 16px rgba(91, 92, 226, 0.24);
        }

        .submit-button:hover,
        .open-button:hover,
        .copy-button:hover {
            transform: translateY(-1px);
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #5d5fe0, var(--primary-dark));
            box-shadow: 0 10px 20px rgba(91, 92, 226, 0.3);
        }

        .submit-button:disabled {
            cursor: wait;
            opacity: 0.78;
            transform: none;
        }

        .spinner {
            display: none;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .is-loading .spinner {
            display: inline-block;
        }

        .error,
        .server-error {
            margin: 12px 2px 0;
            color: #b42318;
            font-size: 0.86rem;
        }

        .server-error {
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fff1f2;
        }

        .result-card {
            margin-top: 16px;
            padding: 26px;
            border: 1px solid #d9dcff;
            border-radius: 15px;
            background: linear-gradient(135deg, #f2f3ff, #effcf8);
            animation: rise 0.45s ease both;
        }

        .result-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 20px;
            color: #292b68;
            font-size: 1.05rem;
        }

        .success-icon {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border-radius: 50%;
            color: #ffffff;
            background: #18a879;
            font-size: 0.85rem;
        }

        .short-url {
            display: block;
            margin-bottom: 20px;
            color: #383ab5;
            font-size: 1.12rem;
            font-weight: 800;
            overflow-wrap: anywhere;
            text-decoration: none;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        .result-actions {
            display: flex;
            gap: 9px;
        }

        .copy-button,
        .open-button {
            padding: 10px 14px;
            font-size: 0.88rem;
        }

        .copy-button {
            color: #35375f;
            background: #ffffff;
            border: 1px solid #d8dcf0;
        }

        .open-button {
            color: #ffffff;
            background: #30328f;
            text-decoration: none;
        }

        .result-meta {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .footer-note {
            margin: 22px 0 0;
            color: #929bb0;
            font-size: 0.78rem;
            text-align: center;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .page {
                width: min(100% - 28px, 560px);
                padding-top: 30px;
            }

            .hero {
                margin-top: 58px;
            }

            .form-panel,
            .result-card {
                padding: 20px;
            }

            .input-row {
                flex-direction: column;
                padding: 8px;
            }

            .submit-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="brand" aria-label="URL Shortener">
        <span class="brand-mark" aria-hidden="true">↗</span>
        <span>URL Shortener</span>
    </div>

    <header class="hero">
        <p class="eyebrow">Simple. Fast. Shareable.</p>
        <h1>Shorten your links.</h1>
        <p class="subtitle">Turn long URLs into clean, memorable links you can share anywhere.</p>
    </header>

    <main class="shortener-card">
        <div class="form-panel">
            <form id="shorten-form" th:action="@{/shorten}" th:object="${shortenURLRequest}" method="post"
                  novalidate>
                <label for="url">Paste your long URL</label>
                <div class="input-row">
                    <input id="url" type="url" th:field="*{url}" placeholder="https://example.com/your-link"
                           autocomplete="url" aria-describedby="url-error" required>
                    <button class="submit-button" type="submit">
                        <span class="button-label">Shorten URL</span>
                        <span class="spinner" aria-hidden="true"></span>
                    </button>
                </div>
                <p id="url-error" class="error" role="alert"
                   th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></p>
                <p id="client-error" class="error" role="alert" hidden>Please enter a valid URL.</p>
            </form>
            <p class="server-error" role="alert" th:if="${serverError}" th:text="${serverError}"></p>
        </div>

        <section class="result-card" th:if="${shortenURLResponse}" aria-live="polite">
            <h2 class="result-heading">
                <span class="success-icon" aria-hidden="true">✓</span>
                Your shortened link is ready
            </h2>
            <a class="short-url" id="short-url"
               th:href="${shortenURLResponse.shortURL}"
               th:text="${shortenURLResponse.shortURL}"></a>
            <div class="result-actions">
                <button class="copy-button" id="copy-button" type="button"
                        th:data-url="${shortenURLResponse.shortURL}">
                    <span aria-hidden="true">□</span>
                    <span>Copy</span>
                </button>
                <a class="open-button" th:href="${shortenURLResponse.shortURL}" target="_blank"
                   rel="noopener noreferrer">
                    <span>Open URL</span>
                    <span aria-hidden="true">↗</span>
                </a>
            </div>
            <p class="result-meta">
                Original URL:
                <span th:text="${shortenURLResponse.originalURL}"></span>
            </p>
        </section>
    </main>

    <p class="footer-note">Your original URL is never changed.</p>
</div>

<script>
    (() => {
        const form = document.getElementById("shorten-form");
        const input = document.getElementById("url");
        const clientError = document.getElementById("client-error");
        const submitButton = form?.querySelector(".submit-button");
        const buttonLabel = form?.querySelector(".button-label");

        form?.addEventListener("submit", (event) => {
            clientError.hidden = input.validity.valid;
            if (!input.validity.valid) {
                event.preventDefault();
                input.focus();
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add("is-loading");
            buttonLabel.textContent = "Shortening...";
        });

        const copyButton = document.getElementById("copy-button");
        copyButton?.addEventListener("click", async () => {
            const url = copyButton.dataset.url;
            const label = copyButton.querySelector("span:last-child");

            try {
                await navigator.clipboard.writeText(url);
                label.textContent = "Copied";
                window.setTimeout(() => {
                    label.textContent = "Copy";
                }, 1800);
            } catch {
                label.textContent = "Copy failed";
            }
        });
    })();
</script>
</body>
</html>
